# Mass and devotion schedule
# =============================================================================
# Confirmed by the committee in FIXES V1 (2026-09-21).
#
# HOW TO EDIT THIS FILE
#
#   - `day` must be one of: monday, tuesday, wednesday, thursday, friday,
#     saturday, sunday, first-friday, weekday.
#   - `time` is free text and is printed exactly as written. Keep one format.
#   - `language` is a proper noun and is NOT translated.
#   - `kind` is mass, confession, adoration or devotion. The Rosary is a
#     devotion.
#   - `highlight: true` puts the row on the contact page summary.
#   - `order` controls the order everywhere. Lower comes first, and the home
#     page relies on it to print the Rosary above the Mass it precedes.
#
# Confession ("30 minutes before Mass") and feast day Masses ("refer to the
# bulletin") are notes rather than rows — see `schedule.confessionNote` and
# `schedule.feastNote` in src/i18n/ui.ts.
# =============================================================================

