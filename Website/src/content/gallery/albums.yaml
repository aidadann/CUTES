# Gallery albums
# =============================================================================
# This file names and orders the albums. It does NOT list the photos.
#
# HOW TO ADD PHOTOS
#
#   1. Put the image files in  src/assets/gallery/<id>/
#      — the folder name must match the `id` below, exactly.
#   2. Commit. That is all. The photos appear in filename order.
#
# To arrange an album, prefix the filenames: 01-arrival.jpg, 02-mass.jpg, and
# so on. To add a new album, add an entry here and create the matching folder.
#
# Before committing a batch of photos, downscale them to about 2000px on the
# long edge. Full-size phone photos turn a 30-second build into a 10-minute one
# and burn through the free CI minutes.
# =============================================================================

- id: mass
  order: 1
  title:
    en: Mass
    ms: Misa
  description:
    en: Sunday and student Masses at Most Holy Redeemer.
    ms: Misa Ahad dan Misa pelajar di Most Holy Redeemer.

- id: fellowship
  order: 2
  title:
    en: Fellowship
    ms: Perhimpunan
