# CUTES Committee roster
# =============================================================================
# TODO (committee): every name below is a PLACEHOLDER. Replace them with the
# real committee before launch, then delete this notice.
#
# HOW TO EDIT THIS FILE
#
#   - The academic year is set in src/data/site.ts, not here.
#   - `id` must match a `ministry.<id>` key in src/i18n/ui.ts.
#   - `role` must be one of: coordinator, vice-coordinator-1,
#     vice-coordinator-2, treasurer, vice-treasurer, secretary,
#     vice-secretary, leader, assistant, member.
#   - `detail` is optional — course, faculty or year of study.
#   - Add or remove `- name:` lines freely. There is no limit.
#
# If you mistype something the site will refuse to build and the error message
# will name this file and the line. That is on purpose: a broken build is
# better than a blank page in front of the parish.
# =============================================================================

