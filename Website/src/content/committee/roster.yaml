# CUTES Committee roster
# =============================================================================
# Membership supplied by the committee in FIXES V2 (2026-09-28).
#
# TWO THINGS ARE STILL WAITING ON THE COMMITTEE:
#
#   1. The Ministry of Leaders offices below (Coordinator, Vice Coordinator I
#      and II, Treasurer, Vice Treasurer, Secretary, Vice Secretary) were
#      assigned in the order the committee listed the seven names. Confirm
#      them.
#   2. FIXES V2 named no leader or assistant for the other seven ministries,
#      so everyone in them is published as `member`. Send the leaders and we
#      will change their `role:` to `leader` / `assistant`.
#
# HOW TO EDIT THIS FILE
#
#   - The academic year is set in src/data/site.ts, not here.
#   - `id` must match a `ministry.<id>` key in src/i18n/ui.ts.
#   - `role` must be one of: coordinator, vice-coordinator-1,
#     vice-coordinator-2, treasurer, vice-treasurer, secretary,
#     vice-secretary, leader, assistant, member.
#   - `detail` is optional — course, faculty or year of study. Members who did
#     not give a programme simply have no `detail:` line.
#   - Add or remove `- name:` lines freely. There is no limit.
#
# A few people serve in two ministries. That is intentional: list them under
# both.
#
# If you mistype something the site will refuse to build and the error message
# will name this file and the line. That is on purpose: a broken build is
# better than a blank page in front of the parish.
# =============================================================================

