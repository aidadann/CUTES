# Nobody is going to remember to update dependencies on a student-run site, so
# Dependabot does it. Monthly, grouped into one pull request, so the committee
# sees one thing to merge rather than fifteen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /Website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
