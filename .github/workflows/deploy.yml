name: Build and deploy

# What this does
#
#   Every push to `main`  -> build the site and publish it to GitHub Pages.
#   Every pull request    -> build and test only, so a broken change cannot be
#                            merged without someone seeing a red cross.
#
# The site also deploys to Cloudflare Pages, which watches the repository
# itself and needs nothing from this file. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queue rather than cancel, so a bulletin uploaded a
# minute after a roster edit still gets published.
concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: Website

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: Website/.nvmrc
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves this repository from a sub-path, so every
          # internal link has to be prefixed with it. Read from the repository
          # name so renaming the repo does not silently break every link.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: ${{ github.event.repository.owner.login && format('https://{0}.github.io', github.event.repository.owner.login) }}

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website/dist

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests are built but never published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
